services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: multi_tenant_pos
      POSTGRES_USER: app_user
      # Required: set POSTGRES_PASSWORD in your .env file (copy from .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (copy .env.example)}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  db-test:
    image: postgres:13
    environment:
      POSTGRES_DB: multi_tenant_pos_test
      POSTGRES_USER: app_user
      # Required: set POSTGRES_TEST_PASSWORD in your .env file (copy from .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD must be set in .env (copy .env.example)}
    ports:
      - "55433:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
  postgres_data_test:
